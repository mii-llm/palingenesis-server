name: Publish release image
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$image" .
      - name: Verify authenticated job execution
        run: |
          export PGS_SERVER_TOKEN=$(openssl rand -hex 32)
          docker run --name release-smoke --init -d -e PGS_SERVER_TOKEN "$IMAGE"
          docker exec -i release-smoke python - < tests/container_smoke.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: docker push "$IMAGE"
